name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A called workflow can only narrow the caller's permissions, never widen them,
# and this repo's default workflow token is read-only. Without this block the
# run fails at startup before any job is created.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    # Standard lives in superhighfives/control-room so every repo
    # reviews the same way. Repo-specific rules go in CLAUDE.md.
    uses: superhighfives/control-room/.github/workflows/review.yml@main
    with:
      # The shared workflow sets up one runtime: "bun" installs Bun (latest)
      # but skips setup-node, so tsc and biome run on the runner's
      # preinstalled Node. Typecheck and lint don't need Node 24.
      runtime: bun
      setup_command: bun install --frozen-lockfile
      verify_commands: |
        bun run typecheck
        bun run lint
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
