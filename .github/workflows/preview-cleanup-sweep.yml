name: Sweep orphaned preview resources

# Backstop for cleanup-preview in web-deploy.yml. That job only runs when a PR
# actually closes through GitHub's webhook — if it ever gets skipped (Actions
# outage, a PR closed before deploy-preview ran, cleanup-preview itself
# failing) an orphaned Worker/Queue pair is left behind with nothing to catch
# it. This sweep independently lists every PR-preview-shaped Worker and Queue
# in the account, cross-checks against currently-open PRs, and deletes
# anything that isn't one.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: src/api
        run: pnpm install

      - name: Find and delete orphaned preview resources
        working-directory: src/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          repo = os.environ["REPO"]
          gh_token = os.environ["GH_TOKEN"]

          def cf_get_all(path):
              items = []
              page = 1
              while True:
                  req = urllib.request.Request(
                      f"https://api.cloudflare.com/client/v4/accounts/{account}/{path}?page={page}&per_page=50",
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  with urllib.request.urlopen(req) as resp:
                      data = json.load(resp)
                  if not data.get("success"):
                      print("Cloudflare API error:", data.get("errors"), file=sys.stderr)
                      sys.exit(1)
                  batch = data["result"]
                  if not batch:
                      break
                  items.extend(batch)
                  info = data.get("result_info", {})
                  if page >= info.get("total_pages", page):
                      break
                  page += 1
              return items

          def gh_open_pr_numbers():
              numbers = set()
              page = 1
              while True:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100&page={page}",
                      headers={
                          "Authorization": f"Bearer {gh_token}",
                          "Accept": "application/vnd.github+json",
                      },
                  )
                  with urllib.request.urlopen(req) as resp:
                      batch = json.load(resp)
                  if not batch:
                      break
                  numbers.update(pr["number"] for pr in batch)
                  page += 1
              return numbers

          open_prs = gh_open_pr_numbers()
          print(f"Open PRs: {sorted(open_prs)}")

          scripts = cf_get_all("workers/scripts")
          queues = cf_get_all("queues")
          print(f"{len(scripts)} scripts, {len(queues)} queues in account (all pages)")

          pattern = re.compile(
              r"^(nylon-impossible-api-pr|nylon-impossible-pr|nylon-impossible-research-pr)-(\d+)$"
          )

          orphan_prs = set()
          for s in scripts:
              m = pattern.match(s["id"])
              if m and int(m.group(2)) not in open_prs:
                  orphan_prs.add(int(m.group(2)))
          for q in queues:
              m = pattern.match(q["queue_name"])
              if m and int(m.group(2)) not in open_prs:
                  orphan_prs.add(int(m.group(2)))

          if not orphan_prs:
              print("Nothing orphaned — clean.")
              sys.exit(0)

          print(f"Orphaned PR numbers to clean up: {sorted(orphan_prs)}")

          failed = False

          def run(desc, pr, *args):
              global failed
              result = subprocess.run(args, capture_output=True, text=True)
              print(f"::group::{desc} (pr-{pr})")
              print(result.stdout)
              print(result.stderr)
              print("::endgroup::")
              if result.returncode != 0:
                  combined = (result.stdout + result.stderr).lower()
                  if "does not exist" in combined:
                      print(f"{desc}: already gone, ok")
                  else:
                      print(f"::error::{desc} for pr-{pr} failed unexpectedly")
                      failed = True

          # Same ordering as cleanup-preview in web-deploy.yml, and for the same
          # reason: a Worker can't be deleted while it's a registered Queue
          # consumer, and a Queue can't be deleted while a Worker still binds to
          # it. Unregister the consumer, delete the workers, then the queue.
          for pr in sorted(orphan_prs):
              run(
                  "Remove queue consumer", pr,
                  "pnpm", "exec", "wrangler", "queues", "consumer", "remove",
                  f"nylon-impossible-research-pr-{pr}", f"nylon-impossible-api-pr-{pr}",
              )
              run(
                  "Delete API worker", pr,
                  "pnpm", "exec", "wrangler", "delete",
                  "--name", f"nylon-impossible-api-pr-{pr}", "--force",
              )
              run(
                  "Delete Web worker", pr,
                  "pnpm", "exec", "wrangler", "delete",
                  "--name", f"nylon-impossible-pr-{pr}", "--force",
              )
              run(
                  "Delete research queue", pr,
                  "pnpm", "exec", "wrangler", "queues", "delete",
                  f"nylon-impossible-research-pr-{pr}",
              )

          sys.exit(1 if failed else 0)
          PYEOF
