name: Generate Marketing Screenshots

# Runs *after* a successful production deploy rather than as part of it.
#
# This used to be a `screenshots` job inside web-deploy.yml, which meant a flake
# in here reported "Deploy to Cloudflare" as failed: every red run of that
# workflow in the six weeks before this was written was this job, with
# deploy-production green in all of them. A reusable-workflow job can't be given
# `continue-on-error`, so the fix is to stop coupling the two — regenerating
# images for a different repo's landing page is downstream of the deploy, not
# part of it, and it now has a run (and a status) of its own.
#
# ios-release.yml still calls this as a reusable workflow, so it keeps the
# workflow_call trigger. A screenshot flake can therefore still redden an App
# Store release; capture degrading to the last good screenshots (see
# capturePhase in generate.ts) is what keeps that rare.
on:
  workflow_dispatch:
    inputs:
      force_ios:
        description: "Rebuild the iOS screenshots even if cached ones match this revision"
        type: boolean
        default: false
      strict:
        description: "Fail if any screenshot had to fall back to a cached one"
        type: boolean
        default: true
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]
  # ios-release.yml still calls this directly after an App Store release, so the
  # iOS shots reflect the released build. `uses:` only resolves against a
  # workflow that declares workflow_call, and workflow_run above can't stand in
  # for it — it's scoped to "Deploy to Cloudflare", which a release never runs.
  workflow_call:
    inputs:
      force_ios:
        type: boolean
        default: false
      # Callers get the lenient default: a flaky capture degrades to the last
      # good screenshots rather than reddening whatever pipeline invoked this.
      strict:
        type: boolean
        default: false
    secrets:
      CLERK_DEVELOPMENT_PUBLISHABLE_KEY:
        required: true
      CLERK_DEVELOPMENT_SECRET_KEY:
        required: true
      CLERK_DEVELOPMENT_USER_EMAIL:
        required: true
      SUPERHIGHFIVES_DEPLOY_TOKEN:
        required: true

permissions:
  contents: read

# The publish step commits and pushes to superhighfives.com, so two overlapping
# deploys must not race each other there. Queue rather than cancel: a cancelled
# run could be halfway through that push.
concurrency:
  group: marketing-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    # Dispatched and called invocations always run. Only the workflow_run path
    # needs filtering: web-deploy also runs on pull_request, where
    # deploy-production is skipped and nothing new reached production.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      # Screenshot the commit that was actually deployed. A workflow_run event
      # otherwise checks out the default branch's head, which may already have
      # moved on.
      - name: Checkout nylon-impossible
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout superhighfives.com
        uses: actions/checkout@v7
        with:
          repository: superhighfives/superhighfives.com
          token: ${{ secrets.SUPERHIGHFIVES_DEPLOY_TOKEN }}
          path: superhighfives.com

      - name: Configure git for superhighfives.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        working-directory: superhighfives.com

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # Every capture below is best-effort: generate.ts falls back to whatever
      # is already in src/marketing/source rather than failing the job (see
      # capturePhase). These two restores are what puts something there. A
      # degraded run then composites the previous screenshots, the publish step
      # finds nothing changed, and the flake costs a warning annotation instead
      # of a red run. Nothing is restored on the very first run, so a total
      # capture failure there still fails loudly — as it should.
      - name: Restore last good web screenshots
        uses: actions/cache/restore@v6
        with:
          path: src/marketing/source/web-*.png
          key: marketing-web-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: marketing-web-v2-${{ runner.os }}-

      # The iOS screenshots only change when the app does, but building the app
      # and booting a simulator is ~12 of this job's minutes and its least
      # reliable stretch. Key the cache on the iOS sources (which include the
      # DEBUG screenshot routes and their sample data) plus the manifest that
      # lists the shots and devices, so a web-only deploy
      # skips the simulator entirely. An exact hit means "these screenshots are
      # already current" → skip; a prefix-only hit still restores older PNGs, so
      # if the simulator then flakes there's something to fall back to.
      - name: Restore iOS screenshots for this app revision
        id: ios-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            src/marketing/source/ios-*.png
            src/marketing/source/parity/ios-*.png
          key: marketing-ios-v2-${{ runner.os }}-${{ hashFiles('src/ios/**', 'src/marketing/manifest.json') }}
          restore-keys: marketing-ios-v2-${{ runner.os }}-

      - name: Decide whether to rebuild iOS screenshots
        id: ios
        env:
          CACHE_HIT: ${{ steps.ios-cache.outputs.cache-hit }}
          FORCE_IOS: ${{ inputs.force_ios }}
        run: |
          if [ "$CACHE_HIT" = "true" ] && [ "$FORCE_IOS" != "true" ]; then
            echo "iOS app unchanged — reusing cached screenshots."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "Rebuilding iOS screenshots (cache-hit=$CACHE_HIT force=$FORCE_IOS)."
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: src/marketing

      - name: Select Xcode
        if: steps.ios.outputs.skip != '1'
        run: xcodebuild -version

      - name: Ensure iOS simulator platform is available
        if: steps.ios.outputs.skip != '1'
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs
                     if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else '')
          ")
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator, downloading iOS platform…"
            xcodebuild -downloadPlatform iOS
          fi

      # No migrate/seed step here: generate.ts applies the D1 migrations and
      # writes the demo data (seed.ts) itself, inside the best-effort web
      # capture, because the seed needs the Clerk id of the capture account.
      # iOS needs no data or account: it runs the app's DEBUG screenshot
      # routes over in-memory sample data.

      - name: Generate and publish marketing screenshots
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          CLERK_MARKETING_USER_EMAIL: ${{ secrets.CLERK_DEVELOPMENT_USER_EMAIL }}
          SUPERHIGHFIVES_DIR: ${{ github.workspace }}/superhighfives.com
          MARKETING_SKIP_IOS: ${{ steps.ios.outputs.skip }}
          # A hand-triggered run is asking "does this still work?", so it
          # defaults to the old all-or-nothing standard: any fallback to a
          # cached screenshot fails the run rather than passing quietly.
          MARKETING_STRICT: ${{ inputs.strict && '1' || '' }}
        run: npx tsx generate.ts --all
        working-directory: src/marketing

      # The parity sheet: the same screens on iOS and web, side by side, for
      # review. It's never published, and a failure here doesn't fail the
      # job — a side that didn't capture shows as "not captured" on the sheet.
      # With the iOS cache hit it reuses the cached iOS parity shots.
      - name: Generate the parity sheet
        if: success()
        continue-on-error: true
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          CLERK_MARKETING_USER_EMAIL: ${{ secrets.CLERK_DEVELOPMENT_USER_EMAIL }}
          MARKETING_SKIP_IOS: ${{ steps.ios.outputs.skip }}
        run: npx tsx generate.ts --parity
        working-directory: src/marketing

      - name: Upload the parity sheet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-sheet
          path: src/marketing/output/parity/
          if-no-files-found: ignore

      - name: Summarise capture
        if: always()
        run: |
          status=src/marketing/source/capture-status.json
          [ -f "$status" ] || exit 0
          {
            echo "### Marketing screenshots"
            echo
            echo "| Asset | Source |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value) |"' "$status"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only cache iOS screenshots this run actually captured. Storing a reused
      # (stale) pair under the current revision's key would pin it there, and
      # every later run would skip the simulator and keep publishing the wrong
      # app screenshot.
      - name: Inspect capture results
        id: captured
        if: always()
        run: |
          status=src/marketing/source/capture-status.json
          # Every iOS asset must be fresh: one stale iPad shot cached under
          # this revision would be skipped (and republished) from then on.
          if [ -f "$status" ] && jq -e '
              [to_entries[] | select(.key | startswith("ios-")) | .value]
              | length > 0 and all(. == "fresh")' "$status" > /dev/null; then
            echo "ios_fresh=1" >> "$GITHUB_OUTPUT"
          fi
          # actions/cache/save errors outright when nothing matches its path, so
          # don't call it at all if the job died before capture wrote anything.
          if ls src/marketing/source/web-*.png > /dev/null 2>&1; then
            echo "web_present=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Save iOS screenshots for this app revision
        if: always() && steps.captured.outputs.ios_fresh == '1'
        uses: actions/cache/save@v6
        with:
          path: |
            src/marketing/source/ios-*.png
            src/marketing/source/parity/ios-*.png
          key: marketing-ios-v2-${{ runner.os }}-${{ hashFiles('src/ios/**', 'src/marketing/manifest.json') }}

      - name: Save last good web screenshots
        if: always() && steps.captured.outputs.web_present == '1'
        uses: actions/cache/save@v6
        with:
          path: src/marketing/source/web-*.png
          key: marketing-web-v2-${{ runner.os }}-${{ github.run_id }}

      # Uploading to App Store Connect is manual; this is where the files are.
      - name: Upload App Store screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots
          path: src/marketing/output/app-store/
          if-no-files-found: ignore

      # Reaching here means capture failed *and* there was nothing cached to
      # fall back to — the composer-not-found dump is the usual culprit.
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-debug
          path: |
            src/marketing/source/debug-*.html
            src/marketing/source/debug-*.png
            src/marketing/source/capture-status.json
          if-no-files-found: ignore
