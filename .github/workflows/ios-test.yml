name: Test iOS

on:
  push:
    branches: [main]
    paths:
      - "src/ios/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/ios/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/ios/Nylon Impossible

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Clear stale SwiftPM artifacts
        run: rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData

      - name: Run tests
        run: |
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else '')
          ")
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found, downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
            DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else 'iPhone 16 Pro')
            ")
          fi
          echo "Running tests on: $DEVICE"
          xcodebuild test \
            -project "Nylon Impossible.xcodeproj" \
            -scheme "Nylon Impossible" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults \
            -quiet

      # `-quiet` keeps a passing run readable, but it also swallows the reason a
      # test host dies: a crash shows up as every pending test "failing" in
      # 0.000 seconds with nothing else logged, which is undiagnosable from the
      # log alone. The result bundle holds the real failure messages, so read it
      # back into the log — an artifact alone is no use to anyone without a Mac.
      - name: Summarise test failures
        if: failure()
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No result bundle — the failure was before or outside the test run."
            exit 0
          fi
          # Raw output rather than anything that picks fields out of it: the
          # point is to see what actually happened, and a parser guessing at
          # xcresulttool's schema can hide the one line that matters.
          echo "::group::Test failure summary"
          xcrun xcresulttool get test-results summary --path TestResults.xcresult || true
          echo "::endgroup::"
          echo "::group::Test results tree (truncated)"
          xcrun xcresulttool get test-results tests --path TestResults.xcresult 2>&1 \
            | head -c 40000 || true
          echo "::endgroup::"

      # Kept as well, for anyone with a Mac who wants to open the bundle.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: src/ios/Nylon Impossible/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
