name: Test iOS

on:
  push:
    branches: [main]
    paths:
      - "src/ios/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/ios/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/ios/Nylon Impossible

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Clear stale SwiftPM artifacts
        run: rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData

      - name: Run tests
        run: |
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else '')
          ")
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found, downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
            DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else 'iPhone 16 Pro')
            ")
          fi
          echo "Running tests on: $DEVICE"
          xcodebuild test \
            -project "Nylon Impossible.xcodeproj" \
            -scheme "Nylon Impossible" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults \
            -quiet

      # `-quiet` keeps a passing run readable, but it also swallows the reason a
      # test host dies: a crash shows up as every pending test "failing" in
      # 0.000 seconds with nothing else logged, which is undiagnosable from the
      # log alone. The result bundle holds the real failure messages, so read it
      # back into the log — an artifact alone is no use to anyone without a Mac.
      - name: Summarise test failures
        if: failure()
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No result bundle — the failure was before or outside the test run."
            exit 0
          fi
          echo "::group::Test failure summary"
          xcrun xcresulttool get test-results summary --path TestResults.xcresult || true
          echo "::endgroup::"
          # Every failure line from the whole tree, not the first N bytes of it:
          # truncating by offset can bury the one failure that matters just as
          # effectively as a parser guessing at the schema would.
          echo "::group::Failure messages from the full results tree"
          xcrun xcresulttool get test-results tests --path TestResults.xcresult 2>&1 \
            | grep -B 4 -i 'failure\|crash' | head -n 400 || true
          echo "::endgroup::"
          # "Test crashed with signal trap" names no frame. The crash report
          # does, and it is the only thing that says *where* the trap is —
          # without it a process-wide trap is guesswork. It lives inside the
          # result bundle; the loose .ips files are a fallback, since which
          # directory the simulator writes them to varies.
          echo "::group::Diagnostics exported from the result bundle"
          xcrun xcresulttool export diagnostics \
            --path TestResults.xcresult --output-path exported-diagnostics 2>&1 | head -n 20 || true
          echo "::endgroup::"
          # The crash report is the only thing that names the trapping frame.
          # Print the faulting thread's stack symbolically rather than the first
          # N bytes of the file: the header is ~6KB of process metadata and the
          # frames sit after it, so a byte cap shows everything except the part
          # that matters.
          echo "::group::Crash report stacks"
          find ~/Library/Logs/DiagnosticReports exported-diagnostics \
            -name '*.ips' -mmin -90 2>/dev/null | head -n 5 > /tmp/ips-list || true
          while read -r f; do
            echo "----- $f"
            python3 - "$f" <<'PYEOF' || true
          import json, sys
          raw = open(sys.argv[1], errors="replace").read()
          body = json.loads(raw.split("\n", 1)[1])
          exc = body.get("exception", {})
          print("exception:", exc.get("type"), exc.get("signal"), exc.get("codes"))
          print("termination:", body.get("termination", {}).get("indicator"))
          images = [i.get("name", "?") for i in body.get("usedImages", [])]
          for thread in body.get("threads", []):
              if not thread.get("triggered"):
                  continue
              print("faulting thread:", thread.get("name") or thread.get("queue") or "")
              for n, fr in enumerate(thread.get("frames", [])[:40]):
                  idx = fr.get("imageIndex", -1)
                  image = images[idx] if 0 <= idx < len(images) else "?"
                  sym = fr.get("symbol", "")
                  src = ""
                  if fr.get("sourceFile"):
                      src = f'  ({fr["sourceFile"]}:{fr.get("sourceLine", "?")})'
                  print(f'  {n:2} {image:32.32} {sym}{src}')
          PYEOF
          done < /tmp/ips-list
          echo "::endgroup::"

      # Kept as well, for anyone with a Mac who wants to open the bundle.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: src/ios/Nylon Impossible/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
