name: Test Marketing Web Capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-web-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: src/marketing

      # generate.ts applies the D1 migrations and seeds the demo data itself.
      - name: Capture web screenshots
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          CLERK_MARKETING_USER_EMAIL: ${{ secrets.CLERK_DEVELOPMENT_USER_EMAIL }}
        run: npx tsx generate.ts --capture-web
        working-directory: src/marketing

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: src/marketing/source/web-*.png
