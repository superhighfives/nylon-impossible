name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "src/api/**"
      - "src/todo-agent/**"
      - "package.json"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install

      - name: Lint & typecheck API
        run: pnpm api:check && pnpm api:typecheck

      - name: Lint & typecheck Web
        run: pnpm web:check && pnpm web:typecheck

      - name: Lint & typecheck todo-agent
        run: pnpm todo-agent:check && pnpm todo-agent:typecheck

      - name: Test API
        run: pnpm --filter @nylon-impossible/api test

      - name: Test Web
        run: pnpm --filter @nylon-impossible/web test

  deploy-production:
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      INTERNAL_AGENT_SECRET: ${{ secrets.INTERNAL_AGENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/api
          command: d1 migrations apply nylon-impossible-db --remote

      - name: Deploy todo-agent
        working-directory: src/todo-agent
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/api
          command: deploy --var ENVIRONMENT:production --var CF_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # INTERNAL_AGENT_SECRET is optional here: it isn't set as a repo secret
      # yet, and both workers boot fine without it (the /internal/agent/*
      # routes just reject calls until a value is set on both sides via
      # `wrangler secret put`, matching the note in src/api/wrangler.jsonc).
      - name: Set INTERNAL_AGENT_SECRET on API and todo-agent
        if: ${{ env.INTERNAL_AGENT_SECRET != '' }}
        run: |
          printf '%s' "$INTERNAL_AGENT_SECRET" | pnpm --filter @nylon-impossible/api exec wrangler secret put INTERNAL_AGENT_SECRET
          printf '%s' "$INTERNAL_AGENT_SECRET" | pnpm --filter @nylon-impossible/todo-agent exec wrangler secret put INTERNAL_AGENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Web
        run: pnpm --filter @nylon-impossible/web run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_WEB_PROJECT: ${{ secrets.SENTRY_WEB_PROJECT }}

      - name: Deploy Web
        working-directory: src/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Regenerate marketing screenshots after a production deploy. Skipped on PRs
  # because deploy-production only runs on push/workflow_dispatch, and a job
  # that `needs` a skipped job is skipped too. Runs on its own macos-26 runner.
  screenshots:
    needs: [deploy-production]
    uses: ./.github/workflows/marketing.yml
    secrets: inherit

  # Per-branch preview via Cloudflare Worker Previews (private beta). Replaces
  # the old fully-isolated per-PR stack: no config rewriting, no per-PR queue,
  # no custom domains, and no close-triggered cleanup — stale previews are
  # auto-evicted by the platform. Previews share prod D1 and call prod
  # todo-agent; the research queue consumer and hourly cron only ever run on
  # production, never on a preview. See
  # plans/in-progress/2026-08-13-migrate-pr-previews-to-worker-previews.md.
  #
  # Preview secrets are seeded by this job (see the "Set preview API/Web
  # secrets" steps below), against the Clerk *development* instance —
  # they are not inherited from production.
  deploy-preview:
    needs: [test]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      # Preview name defaults to the git branch, but the Actions checkout is a
      # detached merge ref, so pass it explicitly. Pushing more commits to the
      # same PR reuses this name and keeps the preview URLs stable. Sanitised to
      # the lowercase-alphanumeric-hyphen charset preview names allow.
      - name: Derive preview name
        run: |
          name=$(printf '%s' "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | cut -c1-54 \
            | sed 's/^-*//; s/-*$//')
          echo "PREVIEW_NAME=$name" >> "$GITHUB_ENV"
          echo "Preview name: $name"

      # Previews use their OWN isolated D1 (not prod's), so migrations target the
      # preview database via `--preview` — which resolves the `DB` binding's
      # `preview_database_id` from src/api/wrangler.jsonc. This keeps preview data
      # separate from production; the web preview binds the same DB by id.
      - name: Apply D1 migrations (preview DB)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/api
          command: d1 migrations apply DB --preview --remote

      # Deploy the API preview first and capture its URL — the web build bakes it
      # in at compile time (VITE_API_BASE_URL), so it must exist before the build.
      - name: Deploy preview API
        working-directory: src/api
        run: |
          set -euo pipefail
          out=$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json)
          url=$(printf '%s' "$out" | jq -r '.preview.urls[0] // empty' 2>/dev/null || true)
          if [ -z "$url" ]; then
            # Fallback if the private-beta JSON shape shifts (or the output
            # isn't valid JSON at all, e.g. a banner line before it): grab
            # the first workers.dev URL from the output.
            url=$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the API preview URL from wrangler output."
            printf '%s\n' "$out"
            exit 1
          fi
          echo "API_PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "API preview: $url"

      # Worker Previews inherit neither the top-level config's secrets nor
      # production's — and the old per-PR flow's secret-seeding steps were
      # removed in this migration. Without CLERK_SECRET_KEY the web preview's
      # clerkMiddleware() throws on every SSR request (500), and auth'd API
      # routes reject every call. Re-seed on each run so a fresh PR preview
      # boots working; `preview secret put` targets this preview by name and
      # redeploys it with the secret applied. Idempotent, so re-pushing is fine.
      - name: Set preview API secrets
        working-directory: src/api
        run: |
          set -euo pipefail
          printf '%s' "$CLERK_SECRET_KEY" | pnpm exec wrangler preview secret put CLERK_SECRET_KEY --name "$PREVIEW_NAME"
          printf '%s' "$CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler preview secret put CLERK_PUBLISHABLE_KEY --name "$PREVIEW_NAME"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | pnpm exec wrangler preview secret put CLOUDFLARE_API_TOKEN --name "$PREVIEW_NAME"
          if [ -n "$TAVILY_API_KEY" ]; then
            printf '%s' "$TAVILY_API_KEY" | pnpm exec wrangler preview secret put TAVILY_API_KEY --name "$PREVIEW_NAME"
          fi
          if [ -n "$INTERNAL_AGENT_SECRET" ]; then
            printf '%s' "$INTERNAL_AGENT_SECRET" | pnpm exec wrangler preview secret put INTERNAL_AGENT_SECRET --name "$PREVIEW_NAME"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Previews use the Clerk *development* instance, not production: dev
          # instances accept any request origin, so the *.workers.dev preview
          # URLs work with zero Clerk dashboard config. A pk_live_/sk_live_ pair
          # is domain-locked to nylonimpossible.com and can't serve workers.dev.
          # The worker still reads CLERK_SECRET_KEY/CLERK_PUBLISHABLE_KEY — only
          # the values differ. Same dev keys the marketing workflow already uses.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          INTERNAL_AGENT_SECRET: ${{ secrets.INTERNAL_AGENT_SECRET }}

      - name: Build preview Web
        run: pnpm --filter @nylon-impossible/web run build
        env:
          # Dev-instance publishable key (baked into the bundle) — see the note
          # on the "Set preview API secrets" step for why previews avoid prod.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_BASE_URL: ${{ env.API_PREVIEW_URL }}
          VITE_IS_PREVIEW: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_WEB_PROJECT: ${{ secrets.SENTRY_WEB_PROJECT }}

      - name: Deploy preview Web
        working-directory: src/web
        run: |
          set -euo pipefail
          out=$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json)
          url=$(printf '%s' "$out" | jq -r '.preview.urls[0] // empty' 2>/dev/null || true)
          if [ -z "$url" ]; then
            url=$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the Web preview URL from wrangler output."
            printf '%s\n' "$out"
            exit 1
          fi
          echo "WEB_PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Web preview: $url"

      # The web preview's server-side clerkMiddleware() runs on every SSR request
      # and needs CLERK_SECRET_KEY at runtime (VITE_CLERK_PUBLISHABLE_KEY is baked
      # in at build, but the secret key is not). Seed it so SSR stops 500ing.
      # VITE_CLERK_PUBLISHABLE_KEY is also set as a runtime secret to match the
      # publishable key the bundle was built with. The preview URL is stable by
      # name, so the redeploy this triggers keeps the URL commented below valid.
      - name: Set preview Web secrets
        working-directory: src/web
        run: |
          set -euo pipefail
          printf '%s' "$CLERK_SECRET_KEY" | pnpm exec wrangler preview secret put CLERK_SECRET_KEY --name "$PREVIEW_NAME"
          printf '%s' "$VITE_CLERK_PUBLISHABLE_KEY" | pnpm exec wrangler preview secret put VITE_CLERK_PUBLISHABLE_KEY --name "$PREVIEW_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dev-instance keys — must match the publishable key the bundle was
          # built with above. See the "Set preview API secrets" note.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}

      - name: Comment preview URLs on PR
        uses: actions/github-script@v9
        env:
          WEB_PREVIEW_URL: ${{ env.WEB_PREVIEW_URL }}
          API_PREVIEW_URL: ${{ env.API_PREVIEW_URL }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const webUrl = process.env.WEB_PREVIEW_URL;
            const apiUrl = process.env.API_PREVIEW_URL;

            const body = [
              `### Preview Deployment`,
              ``,
              `| Worker | URL | Status |`,
              `|--------|-----|--------|`,
              `| API | ${apiUrl} | Deployed |`,
              `| Web | ${webUrl} | Deployed |`,
              ``,
              `_Deployed from ${context.sha.substring(0, 7)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
