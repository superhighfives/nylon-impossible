name: Test iOS UI

# The XCUITests (`Nylon ImpossibleUITests`: Done leaving with Undo, 500 todos
# scrolling, pull to refresh, the accessibility audits) on an iPhone simulator
# (#707). They have their own scheme, "Nylon Impossible UI Tests"; the app's
# scheme that ios-test.yml runs is unit tests only. They drive the DEBUG
# `-NylonScreen` routes over in-memory sample data, so there's no network or
# account.
#
# On PRs and main they run on the owner's Mac mini, not here: the foreman
# runs them there and posts the `foreman/ios-ui-test` status (#611,
# scripts/foreman/README.md, "The iOS lane"). This workflow stays for hand
# runs (Actions → Test iOS UI → Run workflow) and before every App Store
# release (ios-release.yml calls this). The hosted simulator is too slow for
# the timing checks, so here they're skipped (NYLON_SLOW_SIMULATOR below);
# the mini runs them in full.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/ios/Nylon Impossible

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: "$GITHUB_WORKSPACE/.github/scripts/require-xcode-27.sh"

      - name: Clear stale SwiftPM artifacts
        run: rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData

      # The same simulator pick as ios-test.yml's iPhone leg.
      - name: Run UI tests
        env:
          # xcodebuild hands TEST_RUNNER_* to the tests with the prefix
          # stripped, so they see NYLON_SLOW_SIMULATOR=1 and skip the timing
          # checks. Only this runner sets it; the Mac mini doesn't.
          TEST_RUNNER_NYLON_SLOW_SIMULATOR: "1"
        run: |
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else '')
          ")
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found, downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
            DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[0]['name'] if devices else 'iPhone 16 Pro')
            ")
          fi
          echo "Running UI tests on: $DEVICE"
          # The hosted simulator sometimes times out launching the app or
          # misses a frame, so a failed test runs once more. A real
          # regression fails both times.
          xcodebuild test \
            -project "Nylon Impossible.xcodeproj" \
            -scheme "Nylon Impossible UI Tests" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath UITestResults \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -quiet

      # Every UI test and its result, and the failures by name, so a red
      # run says which test broke without a Mac to open the bundle.
      - name: Summarise UI tests
        if: always()
        run: |
          if [ ! -d UITestResults.xcresult ]; then
            echo "### UI tests: no result bundle (the failure was before or outside the test run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          xcrun xcresulttool get test-results tests --path UITestResults.xcresult > tests.json || true
          xcrun xcresulttool get test-results summary --path UITestResults.xcresult > summary.json || true
          {
            echo "### UI tests"
            echo
            echo "| Test | Result |"
            echo "| --- | --- |"
            jq -r '.. | objects | select(.nodeType? == "Test Case")
              | "| `\(.nodeIdentifier // .name)` | \(.result) |"' tests.json 2>/dev/null || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # A test that passes on its retry can still be listed in
          # testFailures. Keep it visible as a warning, so a test that
          # flakes on every run doesn't go unnoticed. Anything but a run
          # that passed, an unreadable summary included, reports errors.
          if [ "$(jq -r '.result // ""' summary.json 2>/dev/null)" = "Passed" ]; then
            level=warning; title="UI test passed on retry"; mark="⚠️"
          else
            level=error; title="UI test failed"; mark="❌"
          fi
          jq -r '.testFailures[]? | "\(.testIdentifierString // .testName): \(.failureText)"' summary.json 2>/dev/null \
            | while read -r failed; do
                echo "::$level title=$title::$failed"
                echo "- $mark $failed" >> "$GITHUB_STEP_SUMMARY"
              done

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: src/ios/Nylon Impossible/UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
