name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Collaborators only, read from each event's own author_association —
    # `github.actor_association` doesn't exist, so the old gate skipped every
    # run. Feedback issues and their fix PRs (labelled `feedback`, branch
    # feedback/*) answer to the repo owner alone; see feedback.yml.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      ) && (
        github.actor == github.repository_owner || !(
          contains(github.event.issue.labels.*.name, 'feedback') ||
          contains(github.event.pull_request.labels.*.name, 'feedback') ||
          startsWith(github.event.pull_request.head.ref, 'feedback/')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # read: Claude reads CI results on PRs. write: retaking fix shots.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A feedback fix PR's Before | After table shows the commit it was
      # captured on, so note where the branch is before Claude moves it.
      - name: Note the fix PR's head
        id: head
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName,headRefOid \
            -q '"branch=\(.headRefName)\nsha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

      # If Claude changed the Apple app on a feedback fix PR, the shots are
      # out of date: have feedback.yml retake them from the plan saved in the
      # PR body. This job runs on Linux and can't capture them itself.
      - name: Retake the fix shots
        if: always() && startsWith(steps.head.outputs.branch, 'feedback/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          BRANCH: ${{ steps.head.outputs.branch }}
          BEFORE: ${{ steps.head.outputs.sha }}
        run: |
          after=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [ "$after" != "$BEFORE" ] || { echo "No new commits on $BRANCH."; exit 0; }
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$after" -q '.files[].filename')
          printf '%s\n' "$changed" | grep -q '^src/ios/' || { echo "No app changes, so the shots still hold."; exit 0; }
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body -q .body | grep -q '<!-- fix-shots:plan' \
            || { echo "#$PR has no saved shot plan."; exit 0; }
          gh workflow run feedback.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f issue="${BRANCH#feedback/}" -f capture_only=true
          echo "Retaking the shots for #$PR."
