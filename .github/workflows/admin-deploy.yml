name: Deploy Admin to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/admin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile

      - name: Lint & typecheck Admin
        run: bun run admin:check && bun run admin:typecheck

  deploy-production:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Admin
        run: bun run --cwd src/admin build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: https://api.nylonimpossible.com

      - name: Deploy Admin
        working-directory: src/admin
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
