name: Test Web

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Detect source file changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - 'src/web/**'
              - 'src/api/**'
              - 'src/shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/web-test.yml'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.src == 'true'
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.src == 'true'
        with:
          node-version: 24.21.0

      - run: bun install --frozen-lockfile
        if: steps.changes.outputs.src == 'true'

      - name: Lint & typecheck API
        if: steps.changes.outputs.src == 'true'
        run: bun run api:check && bun run api:typecheck

      - name: Check generated design tokens
        if: steps.changes.outputs.src == 'true'
        run: bun run tokens:check

      - name: Check migration metadata
        if: steps.changes.outputs.src == 'true'
        run: bun run --cwd src/api db:check-meta

      - name: Lint & typecheck Web
        if: steps.changes.outputs.src == 'true'
        run: bun run web:check && bun run web:typecheck

      - name: Test API
        if: steps.changes.outputs.src == 'true'
        run: bun run --cwd src/api test

      - name: Test Web
        if: steps.changes.outputs.src == 'true'
        run: bun run --cwd src/web test

  # The foreman's merge gate is the only thing between an agent's PR and main,
  # so its tests run whenever the script changes.
  foreman:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Detect foreman changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            foreman:
              - 'scripts/foreman/**'
              - '.github/workflows/web-test.yml'

      - name: Shellcheck
        if: steps.changes.outputs.foreman == 'true'
        run: shellcheck -x scripts/foreman/*.sh

      - name: Test the merge gate
        if: steps.changes.outputs.foreman == 'true'
        run: scripts/foreman/test.sh
